<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Apex Velocity</title>
<style>/*__STYLE__*/</style>
</head>
<body>
<div id="boot" style="position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#05070c;color:#eef2f8;font-family:system-ui,-apple-system,Arial,sans-serif;text-align:center;padding:24px">
  <div style="font-size:30px;font-weight:900;font-style:italic;letter-spacing:.02em">APEX <span style="color:#ff2d55">VELOCITY</span></div>
  <div id="boot-msg" style="color:#8d97ab;font-size:15px">Loading the game…</div>
  <div style="width:220px;height:5px;background:#1a2030;border-radius:3px;overflow:hidden"><div id="boot-bar" style="width:8%;height:100%;background:#ff2d55;transition:width .3s"></div></div>
  <div id="boot-err" style="display:none;max-width:560px;color:#ffb3c0;font-size:14px;line-height:1.5;white-space:pre-wrap"></div>
</div>
<script>
(function () {
  // Show any startup problem on screen instead of a blank page.
  function show(msg) {
    var b = document.getElementById('boot'), e = document.getElementById('boot-err'), m = document.getElementById('boot-msg');
    if (!b || !e) return;
    b.style.display = 'flex';
    m.textContent = 'Oops, the game hit a problem while starting:';
    e.style.display = 'block';
    e.textContent = String(msg).slice(0, 600) + '\n\nTry reloading the page. If it keeps happening, tell us what this message says.';
  }
  window.__bootError = show;
  window.addEventListener('error', function (ev) { if (!window.__appStarted) show(ev.message || ev.error || 'Unknown error'); });
  window.addEventListener('unhandledrejection', function (ev) { if (!window.__appStarted) show((ev.reason && (ev.reason.message || ev.reason)) || 'Unknown error'); });
})();
</script>
<div id="app"></div>
<div class="rotate-hint"><div class="rh-phone"></div><b>Turn your phone sideways</b><span>Racing works best in landscape</span></div>
<!--__SCRIPT__-->
</body>
</html>
