<!doctype html>
<html><head><meta charset="utf-8"><title>Golfer body viewer</title>
<style>html,body{margin:0;height:100%;background:#1c2a22}#c{position:fixed;inset:0}</style></head>
<body><div id="c"></div>
<script type="module">
// Golfer model line-up for checking body shape: ?v=front|side|back|close
import * as THREE from '../../vendor/three.module.min.js';
import { Golfer } from '../../src/render/golfer.js';
const q = new URLSearchParams(location.search);
const view = q.get('v') || 'front';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.getElementById('c').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9cc4e4');
scene.add(new THREE.HemisphereLight(0xdfeaff, 0x55704a, 1.4));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.position.set(4, 8, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({ color: '#5f9e45' }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const looks = [
  { shirt: '#c1121f', pants: '#1b1b1b', cap: '#ffffff' },
  { shirt: '#1d3557', pants: '#e9e4d8', cap: '#1d3557', vest: '#6b705c', hat: 'flat', beard: 'beard', hair: '#6b4a2e' },
  { shirt: '#ff5fa2', pattern: 'stripes', pants: '#f1f1f1', hat: 'visor', gender: 'f', hairStyle: 'ponytail', hair: '#d9a441', shorts: true },
  { shirt: '#2a9d8f', pants: '#2b2d42', cap: '#f1faee', skin: '#8d5a3b', hat: 'none', hairStyle: 'curly', hair: '#1e1a18' },
  { shirt: '#ffd23f', pants: '#1d3557', gender: 'f', hat: 'cap', hairStyle: 'long', hair: '#3b2a1f', skin: '#d49a73' },
];
if (q.get('logo')) looks.forEach((l, i) => { l.logo = [{ text: 'THUNDER', bg: '#ffca3a', fg: '#1b1b1b' }, { text: 'ROCKET', bg: '#e63946', fg: '#fff' }, { text: 'GALAXY', bg: '#6a4c93', fg: '#fff' }][i % 3]; l.hat = ['cap', 'visor', 'cap', 'bucket', 'flat'][i]; });
const poses = q.get('poses') ? q.get('poses').split(',') : ['stand', 'address', 'top', 'finish', 'stand'];
const golfers = [];
poses.forEach((pose, i) => {
  const g = new Golfer(looks[i % looks.length]);
  g.setClub(i === 1 ? 'iron' : 'wood', i === 1 ? 0.94 : 1.12, { crown: '#23262b' });
  const z = (i - (poses.length - 1) / 2) * 1.6;
  g.placeAt({ x: 0, y: 0, z }, 0);
  g.baseY = 0;
  if (pose === 'address') g.address();
  else if (pose === 'top') g.setBackswing(1);
  else if (pose === 'finish') { g.setBackswing(1); g.swing(1, null); for (let k = 0; k < 40; k++) g.update(0.05); }
  else { g.react(pose === 'stand' ? 'sad' : pose); g.reaction.t = 2; g.poseReaction(); }
  g.root.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  scene.add(g.root);
  golfers.push(g);
});
const cam = new THREE.PerspectiveCamera(view === 'close' ? 22 : 30, innerWidth / innerHeight, 0.1, 100);
// golfers face +x; the target is along -z
if (view === 'front') cam.position.set(9, 1.3, 0);
else if (view === 'side') cam.position.set(0.3, 1.2, -10);
else if (view === 'back') cam.position.set(-9, 1.3, 0.2);
else if (view === 'dtl') { const zz = (+(q.get('i') || 0) - (poses.length - 1) / 2) * 1.6; cam.position.set(0.9, 1.75, zz + 3.7); cam.lookAt(0.2, 0.9, zz - 2); }
else if (view === 'close') cam.position.set(3.6, 1.35, (golfers.length > 1 ? (+(q.get('i') || 0) - (poses.length - 1) / 2) * 1.6 : 0) + 1.2);
const lookZ = view === 'close' ? (+(q.get('i') || 0) - (poses.length - 1) / 2) * 1.6 : 0;
if (view !== 'dtl') cam.lookAt(view === 'side' ? 0.3 : 0, 0.95, view === 'close' ? lookZ : 0);
renderer.render(scene, cam);
document.title = 'ready';
</script>
</body></html>
