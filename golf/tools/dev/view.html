<!doctype html>
<html><head><meta charset="utf-8"><title>Hole viewer</title>
<style>html,body{margin:0;height:100%;background:#000}#c{position:fixed;inset:0}</style></head>
<body><div id="c"></div>
<script type="module">
import * as THREE from '../../vendor/three.module.min.js';
import { World } from '../../src/render/world.js';
import { generateCourses } from '../../src/data/courses.js';
import { HoleModel } from '../../src/sim/hole.js';
const q = new URLSearchParams(location.search);
const ci = +(q.get('c') || 0), hi = +(q.get('h') || 0), view = q.get('v') || 'tee';
const course = generateCourses()[ci];
const t0 = performance.now();
const hole = new HoleModel(course, hi);
const world = new World(document.getElementById('c'), { quality: q.get('q') || 'high' });
world.setConditions({ timeOfDay: 0.4, overcast: false }, hole.style, hole.teeHeading);
world.loadHole(hole, { crowd: true, board: { title: 'The Augustine Invitational', rows: [{name:'Scotty Schaffield',toPar:-12},{name:'Rory McKilroy',toPar:-10},{name:'Sam Rivers',toPar:-9},{name:'Jonny Rahmirez',toPar:-8},{name:'Tigre Woodson',toPar:-7},{name:'Nelly Kordova',toPar:-7}] } });
const tBuild = performance.now() - t0;
world.setGolfer({ shirt: '#c1121f', pants: '#1b1b1b', cap: '#ffffff' });
const tee = hole.teeSpot();
const h = hole.teeHeading;
world.golfer.setClub('wood', 1.14);
world.golfer.placeAt(tee, h);
if (q.get('bs')) world.golfer.setBackswing(+q.get('bs'));
world.ball.set(tee.x, tee.y + 0.03, tee.z, tee.y, null);
const f = { x: Math.sin(h), z: -Math.cos(h) }, r = { x: Math.cos(h), z: Math.sin(h) };
let pos, look;
if (view === 'tee') { pos = new THREE.Vector3(tee.x - f.x * 3.4 + r.x * 0.5, tee.y + 1.7, tee.z - f.z * 3.4 + r.z * 0.5); look = new THREE.Vector3(tee.x + f.x * 60, tee.y + 2, tee.z + f.z * 60); }
else if (view === 'green') { const p = hole.pin; pos = new THREE.Vector3(p.x - Math.sin(hole.finalHeading) * 35, p.y + 9, p.z + Math.cos(hole.finalHeading) * 35); look = new THREE.Vector3(p.x, p.y, p.z); }
else if (view === 'golfer') { pos = new THREE.Vector3(tee.x + r.x * 3.2 + f.x * 0.3, tee.y + 1.3, tee.z + r.z * 3.2 + f.z * 0.3); look = new THREE.Vector3(tee.x - r.x * 0.5, tee.y + 1.0, tee.z - r.z * 0.5); }
else if (view === 'trees') { const m = hole.pointAtS(hole.length * 0.45); const rr = { x: Math.cos(m.heading), z: Math.sin(m.heading) }; const lat = hole.fwHalf + 4; pos = new THREE.Vector3(m.x + rr.x * lat, hole.heightAt(m.x + rr.x * lat, m.z + rr.z * lat) + 1.7, m.z + rr.z * lat); look = new THREE.Vector3(m.x + rr.x * (lat + 30) + f.x * 20, pos.y + 3, m.z + rr.z * (lat + 30) + f.z * 20); }
else if (view === 'stand') { const p = hole.pin; pos = new THREE.Vector3(p.x - Math.sin(hole.finalHeading) * 60, p.y + 14, p.z + Math.cos(hole.finalHeading) * 60); look = new THREE.Vector3(p.x + Math.sin(hole.finalHeading) * 20, p.y + 4, p.z - Math.cos(hole.finalHeading) * 20); }
else { const m = hole.pointAtS(hole.length / 2); pos = new THREE.Vector3(m.x - f.x * 5, 260, m.z - f.z * 5 + 1); look = new THREE.Vector3(m.x, 0, m.z); }
world.setCamera(pos, look, view === 'golfer' ? 40 : 50); world.snapCamera();
world.focus.set(tee.x, tee.y, tee.z);
let frames = 0;
function loop() { world.frame(1 / 60); frames++; if (frames < 3) requestAnimationFrame(loop); else { document.title = 'ready ' + tBuild.toFixed(0); } }
loop();
window.__info = { build: tBuild, trees: hole.trees.length, desc: hole.describe(), par: hole.par, yards: hole.yards };
</script></body></html>
