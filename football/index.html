<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#060a14">
</head>
<body>
<!-- page:start -->
<title>Gridiron Kings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>html, body { background: #060a14; color: #f2f5ff; }</style>
<link rel="stylesheet" href="css/style.css">

<canvas id="gl" aria-label="Football stadium"></canvas>
<div id="vig"></div>
<div id="veil"></div>

<div id="app">
  <header id="top">
    <div class="brand"><i class="brand-mark"></i><span>Gridiron <b>Kings</b></span></div>
    <div class="top-right">
      <div class="chip" id="divChip">DIV 10</div>
      <div class="chip coinchip" id="coinChip" title="Coins"><i class="coin"></i><span id="coins">0</span></div>
      <button class="iconbtn" id="btnSettings" data-act="settings" aria-label="Settings"></button>
    </div>
  </header>
  <main id="screen" class="screen"></main>
  <nav id="nav" aria-label="Sections"></nav>
</div>

<div id="hud" hidden>
  <div class="sb" id="sb">
    <span class="sb-brand" aria-hidden="true">GK</span>
    <span class="sb-team home" id="sbHome"></span>
    <span class="sb-poss" id="sbPoss" aria-hidden="true"></span>
    <span class="sb-team away" id="sbAway"></span>
    <span class="sb-time"><b id="sbQ">1ST</b><em id="sbClock">2:00</em><i id="sbPC">:40</i></span>
    <span class="sb-down" id="sbDown">1ST &amp; 10</span>
    <span class="sb-spot" id="sbSpot">OWN 25</span>
  </div>
  <div id="prePlate" class="preplate" hidden><div class="pp-down"><b id="ppDown">1st &amp; 10</b></div><div class="pp-clock"><b id="ppClock">:40</b></div><div class="pp-foot"><i id="ppCrest"></i><span id="ppState">Pre-play</span></div></div>
  <div id="ctrlTag" class="ctrltag" hidden><i></i><span></span></div>
  <div id="caption" class="caption" hidden></div>
  <div id="replayBadge" class="replaybadge" hidden><b>Replay</b><span>Tap to skip</span></div>
  <button class="iconbtn hud-pause" id="btnPause" data-act="pause" aria-label="Timeout"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
  <div id="recv" class="recv"></div>
  <div id="banner" class="banner" hidden></div>
  <div id="resultLine" class="resultline" hidden></div>
  <div id="bigFx" class="goalfx" hidden></div>
  <div id="snapPrompt" class="snapprompt" hidden>Ready. Snap the ball when you are.</div>
  <div id="kick" class="kickmeter" hidden><p>Tap KICK when the needle is in the green</p><div class="kick-bar"><i class="kick-zone"></i><b id="kickNeedle"></b></div></div>
  <div id="keysHelp" class="keys"></div>
  <div id="touch" class="touch" hidden>
    <div id="stickZone"><div id="stick"><div id="knob"></div></div></div>
    <button class="tb tb-c" id="tbC" type="button" hidden>AWAY</button>
    <button class="tb tb-a" id="tbA" type="button" hidden>JUKE</button>
    <button class="tb tb-b" id="tbB" type="button" hidden>SNAP</button>
  </div>
  <div id="hotMenu" class="hotmenu" hidden></div>
  <div id="throwBar" class="throwbar" hidden aria-label="Throw to a receiver"></div>
  <div id="playcall" class="playcall" hidden></div>
</div>

<div id="fade"></div>
<div id="overlay" class="overlay" hidden></div>
<div id="toasts" aria-live="polite"></div>
<div id="boot" class="boot"><i class="brand-mark"></i><b>Gridiron Kings</b><span id="bootMsg">Loading the stadium…</span></div>
<script>
  // fonts load in the background so a slow font server can never leave the page blank
  (function () {
    function fonts() {
      var f = document.createElement('link');
      f.rel = 'stylesheet';
      f.href = 'https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap';
      document.head.appendChild(f);
    }
    if (document.readyState === 'complete') fonts(); else window.addEventListener('load', fonts);
    window.addEventListener('error', function (e) {
      if (window.FG_BOOTED) return;
      var m = document.getElementById('bootMsg');
      if (m) m.textContent = 'Something went wrong while loading: ' + (e.message || 'unknown error') + '. Try reloading the page.';
    });
  })();
</script>
<noscript><p style="padding:24px">Gridiron Kings needs JavaScript to run.</p></noscript>

<script src="vendor/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/plays.js"></script>
<script src="js/match.js"></script>
<script src="js/cards.js"></script>
<script src="js/audio.js"></script>
<script src="js/caster.js"></script>
<script src="js/save.js"></script>
<script src="js/input.js"></script>
<script src="js/gfx.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<!-- page:end -->
</body>
</html>
